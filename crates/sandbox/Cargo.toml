[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform sandbox policy execution for Rust process commands"
readme = "README.md"
documentation = "https://docs.rs/sandbox"
keywords = ["sandbox", "bwrap", "bubblewrap", "macos", "process"]
categories = ["command-line-interface", "os::unix-apis"]

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_macros = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "allow"
ignored_unit_patterns = "allow"
module_inception = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unused_async = "allow"

[dev-dependencies]
pretty_assertions.workspace = true
